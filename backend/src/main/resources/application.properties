spring.application.name=budgettracker

# tells Spring Boot where PostgreSQL is running
spring.datasource.url=jdbc:postgresql://localhost:5432/budget_tracker
# Specifies the database user
spring.datasource.username=budget_user
# Reads the password from an environment variable
spring.datasource.password=${DB_PASSWORD}

#Allows Hibernate to update database tables based on
#Java entities during development
spring.jpa.hibernate.ddl-auto=update
# Displays SQL queries in the terminal
spring.jpa.show-sql=true